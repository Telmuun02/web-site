# =============================================================================
# Folio — бүх төслийг нэг командаар:  docker compose up --build
#
#   db        MySQL 8.4          (өгөгдөл named volume-д хадгалагдана)
#   backend   Laravel API        → http://localhost:8000
#   queue     queue:work worker  (CreateLoanJob-ыг боловсруулна)
#   frontend  Vite dev server    → http://localhost:5173
#   mailpit   хуурамч SMTP       → http://localhost:8025 (мэйл уншина)
# =============================================================================

services:
  # --------------------------------------------------------------- db -----
  db:
    image: mysql:8.4
    # unless-stopped — процесс унавал, эсвэл Docker/компьютер дахин асахад
    # автоматаар сэргэнэ. Гэхдээ ГАРААР `docker compose stop` хийсэн бол
    # хүндэтгэж, дараагийн ачаалалтад өөрөө асахгүй.
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: library
      MYSQL_USER: folio
      MYSQL_PASSWORD: folio
    ports:
      # Хостын 3306-г WAMP эзэлсэн байгаа тул 3307 руу гаргав.
      # Контейнеруудын хооронд дотоод 3306 хэвээр ашиглагдана.
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Үүнгүйгээр backend нь MySQL бэлэн болохоос ӨМНӨ migrate ажиллуулж
      # "Connection refused" алдаанд унана. MySQL эхлэхэд 10-20 секунд шаардана.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------- backend -----
  backend:
    # Compose нь `image:` байхгүй үед {project}-{service} гэсэн автомат нэр
    # өгдөг (websites-backend). Тэр нэр нь namespace-гүй тул Docker Hub руу
    # push хийж БОЛДОГГҮЙ — Docker түүнийг албан ёсны library/ орон зайд
    # хамаатуулж, эрхийг нь татгалзана. Энд нэрийг зааж өгснөөр build хийхэд
    # л шууд зөв tag-тай гарч, гараар `docker tag` хийх шат үгүй болно.
    image: tishkanb/websites-backend:1.0.1
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    # Одоо байгаа .env-ээ дахин ашиглана (APP_KEY, CLOUDINARY_* зэрэг).
    # Доорх environment нь түүний ДЭЭР бичигдэнэ — Laravel-ийн dotenv нь
    # аль хэдийн тодорхойлогдсон орчны хувьсагчийг дардаггүй (immutable).
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173

      # Контейнерийн доторх сүлжээ: "db" бол service-ийн нэр.
      # 127.0.0.1 гэвэл backend контейнер ӨӨРИЙГӨӨ хайна.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: library
      DB_USERNAME: folio
      DB_PASSWORD: folio

      # .env дотор sync байсан — тэгвэл ажил хүсэлтийн дотор шууд ажиллаж,
      # 202 Accepted-ийн санаа утгагүй болно. Жинхэнэ worker ашиглая.
      QUEUE_CONNECTION: database
      CACHE_STORE: database

      # Хөгжүүлэлтэд жинхэнэ Gmail руу биш, Mailpit рүү илгээнэ.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""

    # entrypoint ЗААГААГҮЙ нь санаатай.
    #
    # backend/initial.sh нь PROD-ын скрипт: төгсгөлдөө `exec supervisord`
    # дуудаж, доорх command-ыг үл тоомсорлодог. Мөн тэр скрипт nginx асаах
    # гэж оролддог — dev image дотор nginx СУУЛГААГҮЙ (Dockerfile-ийн nginx
    # суулгалт зөвхөн prod шатанд).
    #
    # Тиймээс dev нь ямар ч entrypoint-гүйгээр доорх command-ыг шууд ажиллуулна.
    #
    # `php artisan serve` БИШ гэдгийг анхаар.
    #
    # ServeCommand нь HTTP хүсэлт боловсруулдаг хүүхэд процесс руу зөвхөн
    # $passthroughVariables жагсаалтад буй орчны хувьсагчдыг дамжуулдаг
    # (APP_ENV, PATH, XDEBUG_* г.м.). DB_HOST тэнд БАЙХГҮЙ тул Docker-ийн
    # өгсөн утга хаягдаж, апп нь .env доторх хоосон DB_HOST-ыг уншдаг байсан.
    # Үр дүн: artisan migrate ажиллана, харин /api/books нь "Host: " хоосон
    # гэж унана.
    #
    # PHP-ийн суурилуулсан серверийг Laravel-ийн router script-тэй шууд
    # ажиллуулбал орчин бүтнээрээ өвлөгдөнө. Router нь getcwd()-г public
    # хавтас гэж үздэг тул эхлээд тийш шилжинэ.
    command:
      - sh
      - -c
      - cd public && exec php -S 0.0.0.0:8000 /app/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    ports:
      - "8000:8000"
    volumes:
      # Код bind mount — засвар шууд тусна, image дахин барих шаардлагагүй.
      - ./backend:/app
      # vendor-ыг NAMED volume-д: үгүй бол дээрх mount нь image доторх
      # vendor-ыг далдалж, хостын (эсвэл байхгүй) vendor гарч ирнэ.
      - backend-vendor:/app/vendor
    healthcheck:
      # curl энэ image дотор байхгүй тул PHP-ээр порт нээгдсэн эсэхийг шалгана.
      # start_period — эхний тохиргоо (composer install, migrate) дуустал
      # "эрүүл биш" гэж тооцохгүй хугацаа.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------------------------ queue -----
  queue:
    # Backend-тэй ЯГ ижил image — зөвхөн ажиллуулах команд нь өөр.
    # (Хоёуланд нь НЭГ ижил `image:` утга өгвөл Compose нэг л удаа барьж,
    #  хоёр service хуваалцана — ~1.1 GB хэмнэнэ. Одоогоор тусад нь үлдээв.)
    image: tishkanb/websites-queue:1.0.1
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    # queue:work нь SIGTERM хүлээж авмагц ШИНЭ ажил авахаа болиод, гарт байгаа
    # ажлаа дуусгадаг. 10 секундын анхдагч хугацаа CreateLoanJob-д хүрэлцэхгүй
    # байж болзошгүй тул уртасгав — эс бөгөөс ажил дундуураа тасарна.
    stop_grace_period: 30s
    # backend-тэй ижил шалтгаанаар entrypoint байхгүй (дээрх тайлбарыг үз).
    # Миграцыг backend бус, гараар ажиллуулна:
    #   docker compose exec backend php artisan migrate --force
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5"]
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: library
      DB_USERNAME: folio
      DB_PASSWORD: folio
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    # db биш BACKEND-ийг хүлээнэ — тэр нь эрүүл болсон гэдэг нь миграц дуусчихсан
    # гэсэн үг. Ингэснээр хоёр контейнер ЗЭРЭГ migrate ажиллуулахгүй бөгөөд
    # queue:work нь `jobs` хүснэгт үүсэхээс өмнө асаад унахгүй.
    # (backend өөрөө db-г хүлээдэг тул db дамжуулан баталгаажна.)
    depends_on:
      backend:
        condition: service_healthy

  # --------------------------------------------------------- frontend -----
  frontend:
    image: tishkanb/websites-frontend:1.0.1
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      # dev шатанд Vite server нь ажиллах үед уншдаг тул энд өгөхөд хангалттай.
      # prod build дээр бол ЭНЭ БОЛОХГҮЙ — build-arg байх ёстой (Dockerfile-д
      # тайлбарласан).
      #
      # Хаяг нь ХӨТӨЧӨӨС харагдах хаяг: хүсэлтийг хэрэглэгчийн browser явуулна,
      # контейнер биш. Тиймээс "backend:8000" биш "localhost:8000".
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      # Зөвхөн "асаагдсан" биш, ЭРҮҮЛ болтол хүлээнэ — эс бөгөөс frontend
      # эхлээд асаж, эхний хүсэлтүүд нь холболт олдохгүй амжилтгүй болно.
      backend:
        condition: service_healthy

  # ---------------------------------------------------------- adminer -----
  # Өгөгдлийн сангийн веб редактор → http://localhost:8080
  # phpMyAdmin-ий оронд Adminer сонгосон шалтгаан: ердөө ~20 MB (phpMyAdmin
  # ~150 MB). Удаан сүлжээн дээр энэ ялгаа 30 минут vs 3 минут гэсэн үг.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      # Нээх бүрд сервер/сан сонгож бичихгүйн тулд урьдчилан бөглөнө
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------- mailpit -----
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Веб UI — баталгаажуулах мэйлийг эндээс уншина

  # ----------------------------------------------------- backend-prod -----
  # PROD image-ийг локал дээр турших. Энгийн `up` үед АСАХГҮЙ (profile).
  #
  #   export PASSPORT_PRIVATE_KEY="$(cat backend/storage/oauth-private.key)"
  #   export PASSPORT_PUBLIC_KEY="$(cat backend/storage/oauth-public.key)"
  #   docker compose --profile prodtest up --build backend-prod
  #
  # ЯАГААД ХЭРЭГТЭЙ ВЭ: prod stage (nginx + php-fpm + supervisor) нь өнөөг
  # хүртэл нэг ч удаа баригдаж, ажиллаж байгаагүй. Түүнийг анх удаа Cloud Run
  # дотор ажиллуулах нь debug хийхэд хамгийн муу газар.
  backend-prod:
    profiles: ["prodtest"]
    image: tishkanb/websites-backend-prod:1.0.1
    build:
      context: ./backend
      target: prod
    # VOLUME БАЙХГҮЙ — энэ нь санаатай.
    #
    # dev дээр ./backend нь /app дээр mount хийгдэж, image доторх агуулгыг
    # бүрэн далдалдаг. Тиймээс хостын oauth-*.key харагдаж, түлхүүр байхгүй
    # алдаа хэзээ ч илэрдэггүй. Энд mount байхгүй тул image дотор ЮУ байгаа
    # нь яг тэр чигээрээ ажиллана — Cloud Run дээрхтэй адил.
    env_file:
      - ./backend/.env
    environment:
      # .env доторх local утгуудыг дарж бичнэ.
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8001
      LOG_CHANNEL: stderr

      # Түлхүүр ФАЙЛААР биш, ОРЧНЫ ХУВЬСАГЧААР ирнэ — Cloud Run дээр
      # Secret Manager-ээс яг ингэж ирэх болно.
      #
      # `:-` (хоосон анхдагч) ашигласан шалтгаан: compose нь profile-аар
      # хаагдсан service-ийг ч ГЭСЭН interpolate хийдэг. `:?` тавибал энгийн
      # `docker compose up` хүртэл алдаа өгч, өдөр тутмын ажил тасална.
      #
      # Хэрэв export хийхээ мартвал хувьсагч хоосон ирнэ → Passport файл руу
      # буцаж ханддаг → image дотор файл байхгүй → keys:verify унана.
      # Энэ бол яг тэр алдаа бөгөөд мессеж нь юу хийхийг хэлж өгнө.
      PASSPORT_PRIVATE_KEY: ${PASSPORT_PRIVATE_KEY:-}
      PASSPORT_PUBLIC_KEY: ${PASSPORT_PUBLIC_KEY:-}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: library
      DB_USERNAME: folio
      DB_PASSWORD: folio

      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database

      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      # dev backend нь 8000-г эзэлсэн тул 8001 руу гаргав. Контейнер дотор
      # nginx нь 8000 сонсох тул баруун тал нь 8000 хэвээр — дээрх
      # APP_URL: http://localhost:8001 нь хостоос харагдах хаяг.
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  backend-vendor:
  frontend-node-modules:
